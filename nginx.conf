server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /img/    { add_header Cache-Control "public, max-age=2592000"; }
  location /api/    { proxy_pass http://api:8000; }   # FastAPI service in docker-compose

  location / { try_files $uri /index.html; }         # SPA fallback for client-side routes
}
